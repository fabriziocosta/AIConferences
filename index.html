<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Conference Globe</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <div class="header-copy">
          <div class="title-row">
            <h1>AI Conference Globe <span class="year-badge" aria-label="Conference years">2026–2027</span></h1>
            <div class="header-actions">
              <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
                <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="3.5" /><path d="M12 2.5v2M12 19.5v2M4.58 4.58l1.42 1.42M18 18l1.42 1.42M2.5 12h2M19.5 12h2M4.58 19.42 6 18M18 6l1.42-1.42" /></svg>
                <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" /></svg>
                <span class="theme-toggle-label">Dark</span>
              </button>
            </div>
          </div>
          <p>Deadlines, dates and locations for major AI and machine-learning conferences.</p>
          <div class="summary-row">
            <p id="header-stats" class="summary-strip" aria-label="Conference summary"></p>
            <button id="acronym-toggle" class="acronym-toggle" type="button" aria-pressed="false" aria-label="Show conference names on the globe" title="Show conference names on the globe">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m4 8 8-4 8 4M5 9h14M6 10v8M10 10v8M14 10v8M18 10v8M4 20h16" /></svg>
              <span>Show names</span>
            </button>
          </div>
        </div>
      </header>

      <aside class="timeline-panel" aria-label="Conference timeline">
        <div class="timeline-header">
          <div class="timeline-heading">
            <h2>Conference timeline</h2>
            <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-menu">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
              <span>Filters</span>
            </button>
          </div>
          <div class="timeline-toolbar">
            <div class="controls" aria-label="Timeline filters">
              <button class="control-button is-active" type="button" data-filter="all">All</button>
              <button class="control-button" type="button" data-filter="deadline">Deadlines</button>
              <button class="control-button" type="button" data-filter="conference">Events</button>
            </div>
            <label class="search-field">
              <span class="visually-hidden">Search conferences</span>
              <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
              <input id="search-input" type="search" placeholder="Search conferences…" autocomplete="off" />
            </label>
          </div>
          <div id="filter-menu" class="filter-menu" hidden>
            <label class="filter-field">
              <span>Research area</span>
              <select data-advanced-filter="area" id="area-filter">
                <option value="">All areas</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Ranking</span>
              <select data-advanced-filter="rank" id="rank-filter">
                <option value="">All rankings</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Region</span>
              <select data-advanced-filter="region" id="region-filter">
                <option value="">All regions</option>
                <option value="Europe">Europe</option>
                <option value="North America">North America</option>
                <option value="Asia-Pacific">Asia-Pacific</option>
                <option value="Latin America">Latin America</option>
                <option value="Africa">Africa</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Deadline status</span>
              <select data-advanced-filter="deadlineStatus" id="deadline-status-filter">
                <option value="">All statuses</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Conference month</span>
              <select data-advanced-filter="month" id="month-filter">
                <option value="">All months</option>
              </select>
            </label>
            <button id="clear-filters" class="clear-filters" type="button">Clear all filters</button>
          </div>
          <div class="field-legend-heading">
            <span>Conference types</span>
            <button id="field-legend-toggle" class="field-legend-toggle" type="button" aria-expanded="false" aria-controls="field-legend">
              <span>Show legend</span>
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
          <div id="field-legend" class="field-legend" aria-label="Conference type legend" hidden></div>
        </div>
        <div id="timeline" class="timeline"></div>
      </aside>

      <section class="globe-stage" aria-label="Interactive conference globe">
        <div id="globe" class="globe"></div>
      </section>

      <article id="selection-card" class="selection-card" aria-live="polite"></article>

      <div id="status" class="status" role="status">Loading conference data...</div>
    </main>

    <script src="https://unpkg.com/globe.gl@2.32.1/dist/globe.gl.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
